# Serveur MariaDB jetable pour les tests d'intégration.
#
#   docker compose -f docker-compose.tests.yml up -d     (démarrer)
#   docker compose -f docker-compose.tests.yml down -v   (arrêter et tout effacer)
#
# Le port 13317 évite le MariaDB du poste (3306) et les plages basses que Windows
# réserve à Hyper-V à chaque démarrage (3307-3406 par exemple).
# Les identifiants ci-dessous ne servent qu'à ce conteneur de test.
name: dbtoolkit-tests

services:
  mariadb-tests:
    image: mariadb:11.4
    container_name: dbtoolkit-mariadb-tests
    environment:
      MARIADB_ROOT_PASSWORD: dbtoolkit_tests
    ports:
      - "127.0.0.1:13317:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20
